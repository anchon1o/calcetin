<!doctype html>
<html lang="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calcetín</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#120f38; --ink:#F1EDFF; --muted:#A9A3D6; --panel:rgba(30,24,78,.78); --line:rgba(200,190,255,.16); --glass:rgba(200,190,255,.09);
  --sock:#7E57C2; --sock-acc:#FFD54F;
  --font:"Bricolage Grotesque", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:#0a0a24;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;overflow:hidden}
#sky{position:absolute;inset:0;display:block;touch-action:none;cursor:crosshair}

.top{position:absolute;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 12px;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.topleft,.topright{display:flex;gap:8px;flex:none}
.round{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center;cursor:pointer;padding:0}
.round svg{width:20px;height:20px}
.brand{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);min-width:0;white-space:nowrap;overflow:hidden}
.brand .bs{width:30px;height:34px;flex:none}
.brand .bs svg{width:100%;height:100%;transform:rotate(-12deg)}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.badge{font-size:11px!important;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--glass);color:var(--ink)!important}
.langwrap{position:relative}
.flag{position:relative;display:block;width:24px;height:16px;border-radius:3px;overflow:hidden;isolation:isolate;transform:translateZ(0);line-height:0;flex:none}
.flag svg{position:absolute;left:-1px;top:-1px;width:calc(100% + 2px);height:calc(100% + 2px);display:block}
.flag::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);pointer-events:none}
.langmenu{position:absolute;top:50px;left:0;min-width:170px;padding:6px;border-radius:14px;border:1px solid var(--line);background:#1d1850;box-shadow:0 16px 40px -14px rgba(0,0,0,.6);z-index:8}
.langmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:10px;cursor:pointer;font-size:15px;text-align:left}
.langmenu button.on,.langmenu button:hover{background:var(--glass)}

#toast{position:absolute;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);opacity:0;pointer-events:none;background:#F1EDFF;color:#1a1545;padding:8px 14px;border-radius:12px;font-size:14px;font-weight:600;transition:all .25s;z-index:6;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* o calcetín pendurado na estrela */
#sockOnStar{position:absolute;left:0;top:0;width:58px;height:68px;z-index:4;pointer-events:none;transform-origin:6px 4px}
#sockOnStar svg{width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));transform-origin:30% 2%;animation:swing 3.2s ease-in-out infinite}
#sockOnStar.drop svg{animation:fall .9s cubic-bezier(.34,1.5,.64,1), swing 3.2s ease-in-out .9s infinite}
#sockOnStar.ghosty svg{opacity:.55}
@keyframes fall{0%{transform:translateY(-120px) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes swing{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}}

/* panel inferior */
#sheet{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:520px;background:var(--panel);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border:1px solid var(--line);border-radius:24px;padding:10px 18px 16px;z-index:5;box-shadow:0 14px 50px -20px rgba(0,0,0,.7)}
.handle{display:block;width:44px;height:14px;margin:0 auto 2px;border:0;background:none;cursor:pointer;position:relative;padding:0}
.handle::after{content:"";position:absolute;left:8px;right:8px;top:5px;height:4px;border-radius:4px;background:var(--line)}
.readout{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.tn{font-size:24px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
#deg{font-size:24px;color:var(--muted);font-weight:400;margin-left:6px;font-variant-numeric:tabular-nums}
#delta{font-size:15px;color:var(--muted)}
/* barras de cercanía */
#bars{--c:var(--muted);display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 2px 10px}
#bars i{height:8px;border-radius:5px;background:var(--line);transition:background .5s,box-shadow .5s}
#bars[data-n="1"] i:nth-child(-n+1),#bars[data-n="2"] i:nth-child(-n+2),#bars[data-n="3"] i:nth-child(-n+3),#bars[data-n="4"] i:nth-child(-n+4),#bars[data-n="5"] i{background:var(--c)}
#bars.glow i{box-shadow:0 0 12px var(--c)}
#tag{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:999px;font-size:14px;font-weight:600;background:var(--glass)}
#tag.con{background:#ff9f5a;color:#2a1405}
#tag[hidden]{display:none}
/* selección */
#pick{display:flex;align-items:center;gap:10px;margin:4px 0 10px;padding:8px 8px 8px 12px;border-radius:16px;background:var(--glass)}
#pick[hidden]{display:none}
#pick div{flex:1;min-width:0;display:flex;flex-direction:column}
#pickName{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pickSub{font-size:13px;color:var(--muted)}
#pickGo{flex:none;padding:10px 16px}
#pickGo:disabled{opacity:.45;cursor:default}
/* minimapa */
.minibox{position:absolute;right:12px;top:calc(62px + env(safe-area-inset-top,0px));z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#mini{display:block;width:140px;height:70px;border-radius:12px;border:1px solid var(--line);background:rgba(18,15,56,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;touch-action:manipulation}
#focusBtn[hidden]{display:none}
.meta{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pips{display:flex;gap:6px}
.pip{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line)}
.pip.next{border-color:var(--muted)}
#left,#timer{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
#end{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
#end[hidden]{display:none}
#sheet.collapsed #end{display:none}
.endhead{display:flex;gap:12px;align-items:center}
.endsock{width:56px;height:66px;flex:none}
.endsock svg{width:100%;height:100%;transform:rotate(-10deg)}
#end h2{margin:0;font-size:24px;letter-spacing:-.02em}
.sockname{margin:2px 0 0;color:var(--muted);font-size:14px}
.where{margin:10px 0 12px;font-size:17px;line-height:1.35}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.nums div{display:flex;flex-direction:column}
.nums b{font-size:22px;font-variant-numeric:tabular-nums}
.nums span{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;border:0;border-radius:14px;padding:12px 14px;font-weight:600;font-size:15.5px;cursor:pointer;background:var(--glass)}
.btn.primary{background:var(--sock);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.next-in{margin:10px 0 0;font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}

/* diálogos */
dialog{border:1px solid var(--line);border-radius:22px;background:#19154a;color:var(--ink);padding:22px;max-width:min(440px,calc(100vw - 24px));width:100%;max-height:86vh;overflow:auto}
dialog::backdrop{background:rgba(5,4,20,.55);backdrop-filter:blur(3px)}
dialog h3{margin:0 0 10px;font-size:22px;letter-spacing:-.02em}
dialog p{margin:0 0 10px;line-height:1.45;font-size:15.5px}
.close{position:sticky;float:right;top:0;border:0;background:var(--glass);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
.small{font-size:13px;color:var(--muted)}
label.toggle{display:flex;align-items:center;gap:8px;font-size:15px;margin:10px 0}
.testbox{margin-top:14px;padding:12px;border-radius:14px;background:var(--glass)}
.testrow{display:flex;gap:6px;align-items:center;margin-top:6px}
.testrow .btn{padding:9px 10px;font-size:14px}
#testNum{width:64px;padding:8px;border-radius:10px;border:1px solid var(--line);background:#120f38;color:var(--ink);font:inherit}
/* intro */
.intro{text-align:center}
.intro .isock{width:120px;height:140px;margin:6px auto 8px}
.intro .isock svg{width:100%;height:100%;transform:rotate(-10deg);animation:swing 3.2s ease-in-out infinite;transform-origin:30% 2%}
.intro h3{font-size:24px}
.intro .iname{color:var(--muted);margin-top:-4px}
/* ficha */
.cardhead{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.orb{--c:#fff;width:64px;height:64px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 35%,#fff 0,var(--c) 38%,rgba(0,0,0,0) 72%);box-shadow:0 0 30px var(--c)}
.orb.dso{background:radial-gradient(ellipse at center,rgba(220,210,255,.85) 0,rgba(170,150,255,.35) 40%,transparent 70%);box-shadow:none}
.orb.nebula,.orb.remnant{background:radial-gradient(circle,rgba(255,150,200,.9) 0,rgba(255,120,170,.3) 45%,transparent 72%)}
.orb.planetary{background:radial-gradient(circle,transparent 30%,rgba(140,230,220,.9) 38%,transparent 60%)}
.orb.blackhole{background:radial-gradient(circle,#000 0 30%,rgba(255,180,110,.9) 36%,transparent 62%)}
.orb.galaxy{border-radius:50%/30%;transform:rotate(-20deg)}
.cardhead h3{margin:0}
.kind{margin:2px 0 0!important;color:var(--muted)}
.desc{font-size:16px!important}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:12px 0}
.facts div{display:flex;flex-direction:column}
.facts dt{font-size:12.5px;color:var(--muted)}
.facts dd{margin:0;font-size:15px}
.story{background:var(--glass);padding:10px 12px;border-radius:12px}
.viz{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.viz svg{width:100%;height:auto;background:rgba(0,0,0,.18);border-radius:12px}
.hrt{fill:var(--muted);font:500 9px var(--font)}
/* caixón */
#drawerGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:12px}
.dcell{border:1px solid var(--line);background:var(--glass);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink)}
.dcell.none{cursor:default;background:none}
.dsock{width:44px;height:52px}
.dsock svg{width:100%;height:100%}
.dcell.found .dsock svg{transform:rotate(-10deg)}
.dnum{font-size:12px;font-weight:600}
.dcap{font-size:11px;color:var(--muted);text-align:center;line-height:1.2}
.dcell.lost .dsock{opacity:.7}
:focus-visible{outline:2px solid var(--sock-acc);outline-offset:2px}
@media (max-width:460px){.top{gap:6px;padding:0 8px}.topleft,.topright{gap:6px}.round{width:38px;height:38px}.brand{padding:5px 10px 5px 6px;gap:6px}.brand b{font-size:15px}.brand span{font-size:12.5px}.brand .bs{width:24px;height:28px}}
@media (max-width:380px){.round{width:36px;height:36px}.brand b{font-size:14px}}
/* clasificación */
#rankBtn[hidden]{display:none}
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--glass);margin:4px 0 14px;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:600;padding:8px 6px;border-radius:10px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--sock);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
ol.rank{list-style:none;margin:0 0 10px;padding:0}
ol.rank li{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);font-size:15.5px}
ol.rank li.me{background:var(--glass);border-radius:10px}
ol.rank .pos{width:28px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
ol.rank .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.rank em{color:var(--muted);font-style:normal}
ol.rank b{font-variant-numeric:tabular-nums}
.mypos{font-weight:600}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.statgrid div{background:var(--glass);border-radius:14px;padding:10px;display:flex;flex-direction:column}
.statgrid b{font-size:22px}.statgrid small{font-size:13px;color:var(--muted);font-weight:500}
.statgrid span{font-size:12.5px;color:var(--muted)}
.namebox{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.namebox input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.25);color:var(--ink);font:inherit;font-size:16px;padding:9px 12px}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font:inherit;font-size:13.5px;padding:4px 0;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.15s!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="sky"></canvas>
  <div id="sockOnStar" hidden></div>
  <div class="top">
    <div class="topleft">
      <button class="round" id="helpBtn" aria-label="?"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9.2 9a3 3 0 1 1 4.3 2.7c-.9.4-1.5 1.2-1.5 2.1v.4"/><circle cx="12" cy="18" r=".6" fill="currentColor"/></svg></button>
      <div class="langwrap"><button class="round" id="langBtn"><span id="langFlag" class="flag"></span></button><div class="langmenu" id="langMenu" hidden></div></div>
    </div>
    <div class="brand"><span class="bs" id="brandSock"></span><b>Calcetín</b><span id="retoNum"></span><span class="badge" id="testBadge" hidden></span></div>
    <div class="topright">
      <button class="round" id="rankBtn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7"/></svg></button>
      <button class="round" id="drawerBtn" aria-label="Cajón"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 12h18M10 9h4M10 15h4"/></svg></button>
    </div>
  </div>
  <div class="minibox"><canvas id="mini"></canvas>
    <button class="round" id="focusBtn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12l5-2 11-6-6 11-2 5-2-6z"/></svg></button></div>
  <div id="toast" role="status"></div>
  <section id="sheet" aria-live="polite">
    <button class="handle" id="handle" aria-label="Panel"></button>
    <div id="pick" hidden><div><b id="pickName"></b><span id="pickSub"></span></div><button class="btn primary" id="pickGo"></button></div>
    <div class="readout"><div class="tn"><span id="tuneName"></span><span id="deg"></span></div><div id="delta"></div></div>
    <div id="tag" hidden></div>
    <div id="bars" data-n="0"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="meta"><div class="pips" id="pips"></div><div id="left"></div><div id="timer">0:00</div></div>
    <div id="end" hidden></div>
  </section>
</div>

<dialog id="introDlg" class="intro">
  <div class="isock" id="introSock"></div>
  <h3 data-i18n="intro"></h3>
  <p class="iname" id="introName"></p>
  <p data-i18n="help2"></p>
  <button class="btn primary" data-close style="width:100%" data-i18n="start"></button>
</dialog>

<dialog id="helpDlg">
  <button class="close" data-close>×</button>
  <h3 data-i18n="howTitle"></h3>
  <p data-i18n="help1"></p><p data-i18n="help2"></p><p data-i18n="help3"></p><p data-i18n="help4"></p>
  <label class="toggle"><input type="checkbox" id="soundToggle"> <span data-i18n="sound"></span></label>
  <label class="toggle"><input type="checkbox" id="labelToggle"> <span data-i18n="conNames"></span></label>
  <div class="testbox">
    <p class="small" style="margin:0 0 8px" data-i18n="testTitle"></p>
    <div class="testrow"><label for="testNum" class="small" data-i18n="retoLabel"></label><input id="testNum" type="number" min="0" inputmode="numeric">
      <button class="btn" id="testGo" data-i18n="play"></button><button class="btn" id="testRand" data-i18n="random"></button></div>
    <div class="testrow"><button class="btn" id="resetBtn" data-i18n="reset"></button><button class="btn" id="testToday" data-i18n="today"></button></div>
  </div>
</dialog>

<dialog id="cardDlg"><button class="close" data-close>×</button><div id="cardBody"></div></dialog>

<dialog id="rankDlg"><button class="close" data-close>×</button><h3 data-i18n="rankTitle"></h3>
  <div class="tabs" id="rankTabs"></div>
  <div id="rankBody"></div>
  <div class="namebox"><p class="small" data-i18n="nameLabel"></p>
    <div class="testrow"><input id="nameIn" maxlength="20" autocomplete="nickname"><button class="btn primary" id="nameSave" data-i18n="save"></button></div>
    <p class="small" id="nameMsg"></p><button class="linkbtn" id="nameOff" data-i18n="hideMe"></button></div>
</dialog>

<dialog id="drawerDlg"><button class="close" data-close>×</button><h3 data-i18n="drawerTitle"></h3><p class="small" id="drawerCount"></p><div id="drawerGrid"></div></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
<script>
(async function(){
  // Na versión instalada pídese ao servidor o reto de hoxe; sen servidor (proba local) xógase igual, sen clasificación
  let srv = null;
  if (/^https?:$/.test(location.protocol)) try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch("/api/dia", { cache: "no-store", signal: ctl.signal }); clearTimeout(t);
    if (r.ok){ const j = await r.json(); if (j && j.ids && typeof j.today === "number") srv = j; }
  } catch(e){}
  window.CALCETIN_START(srv);
})();
</script>
</body>
</html>
